<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Web2APK - turn any website into an Android APK" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1326"/>
      <stop offset="1" stop-color="#16305f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#ff8a1f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b9bea"/>
      <stop offset="1" stop-color="#3f74d6"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bcd4ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>
  <circle cx="1130" cy="30" r="120" fill="#ffffff" fill-opacity="0.03"/>
  <circle cx="620" cy="360" r="160" fill="#ffffff" fill-opacity="0.03"/>

  <!-- logo -->
  <image x="56" y="92" width="170" height="170" xlink:href="data:image/png;base64,"/>

  <!-- text -->
  <g font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="256" y="172" font-size="80" font-weight="800" fill="url(#title)" letter-spacing="-1">Web2APK</text>
    <text x="258" y="220" font-size="28" fill="#c9d6ef">Turn any website into an Android APK</text>
    <g font-size="17" font-weight="600">
      <rect x="258" y="248" width="150" height="32" rx="16" fill="#ffffff" fill-opacity="0.10"/>
      <text x="333" y="270" text-anchor="middle" fill="#e6eeff">GitHub Actions</text>
      <rect x="420" y="248" width="138" height="32" rx="16" fill="#ffffff" fill-opacity="0.10"/>
      <text x="489" y="270" text-anchor="middle" fill="#e6eeff">No local setup</text>
      <rect x="570" y="248" width="150" height="32" rx="16" fill="#ff8a1f" fill-opacity="0.90"/>
      <text x="645" y="270" text-anchor="middle" fill="#ffffff">Copy one folder</text>
    </g>
  </g>

  <!-- website window -->
  <g transform="translate(780 105)">
    <rect width="190" height="140" rx="14" fill="#f3f6fb"/>
    <path d="M0 14a14 14 0 0 1 14-14h162a14 14 0 0 1 14 14v16H0z" fill="#d8e1f0"/>
    <circle cx="16" cy="15" r="4" fill="#ff6b5e"/><circle cx="30" cy="15" r="4" fill="#ffc244"/><circle cx="44" cy="15" r="4" fill="#3ddc84"/>
    <rect x="16" y="46" width="90" height="10" rx="5" fill="#3f74d6"/>
    <rect x="16" y="66" width="158" height="8" rx="4" fill="#c5d0e4"/>
    <rect x="16" y="82" width="130" height="8" rx="4" fill="#c5d0e4"/>
    <rect x="16" y="104" width="60" height="20" rx="10" fill="#ff8a1f"/>
  </g>
  <text x="875" y="280" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#9fb4d9">Your website</text>

  <!-- arrow -->
  <g fill="none" stroke="#ff8a1f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M985 175h44" stroke-dasharray="2 10"/>
    <path d="M1018 158l18 17-18 17"/>
  </g>

  <!-- phone -->
  <g transform="translate(1052 90)">
    <rect width="104" height="176" rx="20" fill="#0a0f1c" stroke="#5b8de0" stroke-width="3"/>
    <rect x="8" y="14" width="88" height="148" rx="12" fill="url(#screen)"/>
    <rect x="38" y="6" width="28" height="4" rx="2" fill="#2a3652"/>
    <g fill="#ffffff">
      <path d="M28 104a24 24 0 0 1 48 0z"/>
      <circle cx="42" cy="93" r="3" fill="#3f74d6"/><circle cx="62" cy="93" r="3" fill="#3f74d6"/>
    </g>
    <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"><path d="M38 76l-6-9"/><path d="M66 76l6-9"/></g>
    <text x="52" y="136" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">APK</text>
  </g>
  <text x="1104" y="298" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#9fb4d9">Android app</text>
</svg>
