
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102a43">
  <title>Mallu Connect</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #102a43;
    }
    header {
      background: #102a43;
      color: white;
      padding: 22px;
      font-size: 24px;
      font-weight: bold;
    }
    main { padding: 20px; }
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin: 14px 0;
      box-shadow: 0 3px 12px #0001;
    }
    h2 { margin-top: 0; }
    button {
      background: #1677ff;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      margin: 5px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>💬 Mallu Connect</header>
  <main>
    <div class="card">
      <h2>Welcome!</h2>
      <p>Your community, your connections.</p>
    </div>
    <div class="card">
      <h2>Friends</h2>
      <p>Connect with your friends.</p>
      <button onclick="alert('Firebase setup required')">Find Friends</button>
    </div>
    <div class="card">
      <h2>Community Events</h2>
      <p>Discover upcoming outings and events.</p>
    </div>
    <div class="card">
      <h2>Room Availability</h2>
      <p>Check available rooms and stays.</p>
    </div>
  </main>
</body>
</html>
