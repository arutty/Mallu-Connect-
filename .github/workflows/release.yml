# Publish or refresh a Web2APK release (maintainer only, MANUAL - never runs by itself).
#
# Settings live in  .github/workflows/release.json  (tag, title, prerelease, latest).
# Edit it, push, then: Actions -> Release -> Run workflow.
#
# What happens:
#   * The tag in release.json is NEW (no release for it yet):
#       a new tag + a new release are created at the current commit, the title comes from
#       release.json and the notes are AUTO-GENERATED by GitHub. Add details by hand later.
#   * The release for that tag ALREADY EXISTS:
#       the tag is moved to the current commit and web2apk-setup.zip is replaced.
#       The title and the notes are NOT touched (prerelease / latest flags follow release.json).
#   * An older, different tag is never changed.
#
# WARNING: moving an existing tag changes what people who pinned it in WEB2APK_REF will get.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create or refresh release
    # Only runs in the main Web2APK repo, never in forks. Change the name if your repo differs.
    if: github.repository == 'bhawan-kavinda/Web2APK'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and check release.json
        run: |
          F=".github/workflows/release.json"
          [ -f "$F" ] || { echo "::error::$F not found"; exit 1; }
          jq -e . "$F" >/dev/null || { echo "::error::$F is not valid JSON"; exit 1; }

          TAG=$(jq -r '.tag // ""' "$F")
          PRE=$(jq -r 'if has("prerelease") then .prerelease else false end' "$F")
          LATEST=$(jq -r 'if has("latest") then .latest else true end' "$F")

          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$'; then
            echo "::error::tag must look like v1.2.0 or v1.2.0-beta.1, got: $TAG"
            exit 1
          fi
          case "$PRE" in true|false) ;; *) echo "::error::prerelease must be true or false"; exit 1 ;; esac
          case "$LATEST" in true|false) ;; *) echo "::error::latest must be true or false"; exit 1 ;; esac

          # a -beta tag must be a prerelease, and a normal tag must not be
          case "$TAG" in
            *-beta.*) IS_BETA=true ;;
            *)        IS_BETA=false ;;
          esac
          if [ "$IS_BETA" != "$PRE" ]; then
            echo "::error::tag $TAG and prerelease=$PRE do not match (a -beta tag needs prerelease true, a normal tag needs false)"
            exit 1
          fi
          if [ "$PRE" = "true" ] && [ "$LATEST" = "true" ]; then
            echo "::warning::A prerelease cannot be Latest - latest is ignored."
            LATEST=false
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "PRE=$PRE" >> "$GITHUB_ENV"
          echo "LATEST=$LATEST" >> "$GITHUB_ENV"
          echo "Tag: $TAG | prerelease: $PRE | latest: $LATEST"

      - name: Build setup zip
        run: |
          cd setup
          zip -r ../web2apk-setup.zip .github

      - name: Create or refresh the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SHORT=$(git rev-parse --short HEAD)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists -> moving the tag and refreshing the zip (title and notes untouched)."
            echo "::warning::Tag $TAG is moved to $SHORT. Anyone who pinned $TAG gets this code."
            git tag -f "$TAG"
            git push -f origin "refs/tags/$TAG"
            gh release upload "$TAG" web2apk-setup.zip --clobber
            gh release edit "$TAG" --prerelease="$PRE" --latest="$LATEST"
          else
            echo "Release $TAG is new -> creating it with auto-generated notes."
            TITLE=$(jq -r '.title // ""' .github/workflows/release.json | head -n1)
            [ -n "$TITLE" ] || TITLE="$TAG"
            # a tag that exists without a release is moved here; a missing tag is created by gh
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::warning::Tag $TAG already existed without a release - moved to $SHORT."
              git tag -f "$TAG"
              git push -f origin "refs/tags/$TAG"
            fi
            gh release create "$TAG" web2apk-setup.zip \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --generate-notes \
              --prerelease="$PRE" \
              --latest="$LATEST"
          fi
          echo "Done: $TAG at $SHORT"
