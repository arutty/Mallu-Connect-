# Web2APK - build one or many Android APKs from this web project.
#
# HOW TO USE: copy the whole  .github  folder of the Web2APK repo into the root of your
# web project. It holds:
#   .github/workflows/build-apk.yml   (this file - leave as is)
#   .github/run.json                  (which config json + icon png to build; one entry = one APK)
#   .github/*.json, .github/*.png     (any number of configs / icons - only those listed in run.json are used)
# Push (or run manually) -> Actions tab -> Build APK -> run -> Artifacts -> apk-<name>
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The public Web2APK repo that does the real work, as  owner/repo.
  # People who copy the .github folder do not need to change this.
  WEB2APK_REPO: bhawan-kavinda/Web2APK
  # Release tag of Web2APK to use. It is pinned on purpose: this script receives your signing
  # secrets, so it must not follow a moving branch. Change it only to a tag you trust.
  # (Empty = default branch - not recommended.)
  WEB2APK_REF: 'v1.2.0'

jobs:
  plan:
    name: Read run.json
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - name: Checkout web repo
        uses: actions/checkout@v4

      - name: Read .github/run.json
        id: read
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const dir = '.github';
          const okName = /^[A-Za-z0-9][A-Za-z0-9._-]*$/;
          const fail = (m) => { console.log(`::error::${m}`); process.exit(1); };

          let builds;
          const runFile = `${dir}/run.json`;
          if (!fs.existsSync(runFile)) {
            console.log('::warning::.github/run.json not found -> building app.json + icon.png only');
            builds = [{ config: 'app.json', icon: 'icon.png' }];
          } else {
            let j;
            try { j = JSON.parse(fs.readFileSync(runFile, 'utf8')); } catch (e) { fail(`run.json: ${e.message}`); }
            builds = j && j.builds;
            if (!Array.isArray(builds) || !builds.length) fail('run.json: "builds" must be a non-empty list');
          }

          const seen = new Set();
          const matrix = [];
          builds.forEach((b, i) => {
            const at = `run.json builds[${i}]`;
            if (!b || typeof b !== 'object') fail(`${at} must be an object like {"config": "app.json", "icon": "icon.png"}`);
            const config = String(b.config || '').trim();
            const icon = String(b.icon || '').trim();
            if (!okName.test(config) || !/\.json$/i.test(config)) fail(`${at}: "config" must be a .json file name inside .github, got "${config}"`);
            if (!okName.test(icon) || !/\.png$/i.test(icon)) fail(`${at}: "icon" must be a .png file name inside .github, got "${icon}"`);
            for (const f of [config, icon]) if (!fs.existsSync(`${dir}/${f}`)) fail(`${at}: ${dir}/${f} does not exist`);
            const name = config.replace(/\.json$/i, '');
            if (seen.has(name)) fail(`${at}: config "${config}" is listed twice`);
            seen.add(name);
            matrix.push({ name, config, icon });
          });

          console.log(`Will build ${matrix.length} APK(s):`);
          matrix.forEach((m) => console.log(`  - ${m.config} + ${m.icon}`));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`);
          NODE

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one failing APK must not stop the others
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout web repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get Web2APK
        run: |
          if [ "${GITHUB_REPOSITORY,,}" = "${WEB2APK_REPO,,}" ]; then
            # running inside the Web2APK repo itself (self-test) - no clone needed
            echo "W2A_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            git clone --depth 1 ${WEB2APK_REF:+--branch "$WEB2APK_REF"} "https://github.com/$WEB2APK_REPO.git" "$RUNNER_TEMP/Web2APK"
            echo "W2A_DIR=$RUNNER_TEMP/Web2APK" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          WEB_DIR: ${{ github.workspace }}
          CONFIG_DIR: ${{ github.workspace }}/.github
          # Only these two files are read; every other json / png in .github is ignored.
          CONFIG_FILE: ${{ matrix.config }}
          ICON_FILE: ${{ matrix.icon }}
          OUT_DIR: ${{ github.workspace }}/output
          # Optional signing key (see example.env). Empty = a temporary key is generated.
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: node "$W2A_DIR/scripts/build.mjs"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.name }}
          path: output/*.apk
          if-no-files-found: error
