# Web2APK - build one or many Android APKs from this web project.
#
# HOW TO USE: copy the whole  .github  folder of the Web2APK repo into the root of your
# web project. Layout:
#   .github/workflows/build-apk.yml   (this file - leave as is)
#   .github/run.json                  (the list of app folders to build)
#   .github/<app-name>/app.json       (that app's name, id, version ...)
#   .github/<app-name>/icon.png       (that app's icon)
# Only the folders listed in run.json are built; every other folder is ignored.
# Push (or run manually) -> Actions tab -> Build APK -> run -> Artifacts -> apk-<app-name>
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The public Web2APK repo that does the real work, as  owner/repo.
  # People who copy the .github folder do not need to change this.
  WEB2APK_REPO: bhawan-kavinda/Web2APK
  # Release tag of Web2APK to use. It is pinned on purpose: this script receives your signing
  # secrets, so it must not follow a moving branch. Change it only to a tag you trust.
  # (Empty = default branch - not recommended.)
  WEB2APK_REF: 'v1.1.0'

jobs:
  plan:
    name: Read run.json
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - name: Checkout web repo
        uses: actions/checkout@v4

      - name: Read .github/run.json
        id: read
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const dir = '.github';
          const okName = /^[A-Za-z0-9][A-Za-z0-9._-]*$/;
          const fail = (m) => { console.log(`::error::${m}`); process.exit(1); };

          const runFile = `${dir}/run.json`;
          if (!fs.existsSync(runFile)) fail('.github/run.json not found. Create it like {"builds": ["my-app"]}');
          let j;
          try { j = JSON.parse(fs.readFileSync(runFile, 'utf8')); } catch (e) { fail(`run.json: ${e.message}`); }
          const builds = j && j.builds;
          if (!Array.isArray(builds) || !builds.length) fail('run.json: "builds" must be a non-empty list of folder names, e.g. {"builds": ["my-app"]}');

          const seen = new Set();
          const matrix = [];
          builds.forEach((raw, i) => {
            const at = `run.json builds[${i}]`;
            if (typeof raw !== 'string') fail(`${at} must be a folder name (text), got ${JSON.stringify(raw)}`);
            const name = raw.trim();
            if (!okName.test(name)) fail(`${at}: "${name}" is not a valid folder name (letters, digits, . _ - only)`);
            if (name === 'workflows') fail(`${at}: "workflows" is not an app folder`);
            if (seen.has(name)) fail(`${at}: folder "${name}" is listed twice`);
            seen.add(name);
            const folder = `${dir}/${name}`;
            if (!fs.existsSync(folder) || !fs.statSync(folder).isDirectory()) fail(`${at}: folder ${folder}/ does not exist`);
            for (const f of ['app.json', 'icon.png'])
              if (!fs.existsSync(`${folder}/${f}`)) fail(`${at}: ${folder}/${f} is missing`);
            matrix.push({ name });
          });

          console.log(`Will build ${matrix.length} APK(s):`);
          matrix.forEach((m) => console.log(`  - ${dir}/${m.name}/  (app.json + icon.png)`));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`);
          NODE

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one failing APK must not stop the others
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout web repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get Web2APK
        run: |
          if [ "${GITHUB_REPOSITORY,,}" = "${WEB2APK_REPO,,}" ]; then
            # running inside the Web2APK repo itself (self-test) - no clone needed
            echo "W2A_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            git clone --depth 1 ${WEB2APK_REF:+--branch "$WEB2APK_REF"} "https://github.com/$WEB2APK_REPO.git" "$RUNNER_TEMP/Web2APK"
            echo "W2A_DIR=$RUNNER_TEMP/Web2APK" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          WEB_DIR: ${{ github.workspace }}
          # Only this app's folder (app.json + icon.png) is read; all other folders are ignored.
          CONFIG_DIR: ${{ github.workspace }}/.github/${{ matrix.name }}
          OUT_DIR: ${{ github.workspace }}/output
          # Optional signing key (see example.env). Empty = a temporary key is generated.
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: node "$W2A_DIR/scripts/build.mjs"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.name }}
          path: output/*.apk
          if-no-files-found: error
