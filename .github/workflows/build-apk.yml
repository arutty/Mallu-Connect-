# Web2APK - build one or many Android APKs (FORK / MULTI-APP workflow).
#
# WHO USES THIS FILE: people who FORK the Web2APK repo, or who want to build 2-3+ APKs at once.
# (If you only copy a .github folder into your own project, use  setup/.github  instead.)
#
# Layout:
#   .github/workflows/build-apk.yml   (this file - leave as is)
#   .github/run.json                  ("source" + the list of app folders to build)
#   .github/<app-name>/app.json       (that app's name, id, version ...)
#   .github/<app-name>/icon.png       (that app's icon)
#
# run.json "source":
#   "clone"  (default) -> the official Web2APK release (latest tag, see WEB2APK_REF) is cloned.
#   "."                -> scripts/build.mjs from THIS repo is used (your own edited fork).
# Only the folders listed in "builds" are built; every other folder is ignored.
# A missing app.json / icon.png in a listed folder is not an error: Web2APK's defaults are used.
# Push (or run manually) -> Actions tab -> Build APK -> run -> Artifacts -> apk-<app-name>
name: MALLU CONNECT

on:
  push:
    branches: [main, master]
    # A push that changes ONLY .md files (README, guides, notes) does not start a build.
    # If the push also changes any other file, the build runs as usual.
    paths-ignore:
      - '**.md'
  workflow_dispatch:      # the Run workflow button always works

permissions:
  contents: read

env:
  # The public Web2APK repo that does the real work, as  owner/repo.
  # People who copy the .github folder do not need to change this.
  WEB2APK_REPO: bhawan-kavinda/Web2APK
  # Which Web2APK release to use when run.json source is "clone".
  #   'latest'  = always the newest release tag (vX.Y.Z) of the Web2APK repo. Publish a new
  #               release there and every user gets it automatically.
  #   'v1.1.0'  = pin one exact tag (safest: this script receives your signing secrets,
  #               so a pinned tag never changes under you).
  # Branches are never followed - only release tags. (Empty = same as 'latest'.)
  WEB2APK_REF: 'latest'

jobs:
  plan:
    name: Read run.json
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      source: ${{ steps.read.outputs.source }}
    steps:
      - name: Checkout web repo
        uses: actions/checkout@v4

      - name: Read .github/run.json
        id: read
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const dir = '.github';
          const okName = /^[A-Za-z0-9][A-Za-z0-9._-]*$/;
          const fail = (m) => { console.log(`::error::${m}`); process.exit(1); };

          const runFile = `${dir}/run.json`;
          if (!fs.existsSync(runFile)) fail('.github/run.json not found. Create it like {"builds": ["my-app"]}');
          let j;
          try { j = JSON.parse(fs.readFileSync(runFile, 'utf8')); } catch (e) { fail(`run.json: ${e.message}`); }
          const rawSource = j && j.source !== undefined ? j.source : 'clone';
          const source = typeof rawSource === 'string' ? rawSource.trim() : rawSource;
          if (source !== 'clone' && source !== '.') fail(`run.json: "source" must be "clone" (official release) or "." (this repo's own build script), got ${JSON.stringify(rawSource)}`);
          if (source === '.' && !fs.existsSync('scripts/build.mjs')) fail('run.json: "source" is "." but scripts/build.mjs does not exist in this repo. Use a fork of Web2APK, or set "source" to "clone".');
          const builds = j && j.builds;
          if (!Array.isArray(builds) || !builds.length) fail('run.json: "builds" must be a non-empty list of folder names, e.g. {"builds": ["my-app"]}');

          const seen = new Set();
          const matrix = [];
          builds.forEach((raw, i) => {
            const at = `run.json builds[${i}]`;
            if (typeof raw !== 'string') fail(`${at} must be a folder name (text), got ${JSON.stringify(raw)}`);
            const name = raw.trim();
            if (!okName.test(name)) fail(`${at}: "${name}" is not a valid folder name (letters, digits, . _ - only)`);
            if (name === 'workflows') fail(`${at}: "workflows" is not an app folder`);
            if (seen.has(name)) fail(`${at}: folder "${name}" is listed twice`);
            seen.add(name);
            const folder = `${dir}/${name}`;
            if (!fs.existsSync(folder) || !fs.statSync(folder).isDirectory()) fail(`${at}: folder ${folder}/ does not exist`);
            for (const f of ['app.json', 'icon.png'])
              if (!fs.existsSync(`${folder}/${f}`)) console.log(`::warning::${folder}/${f} is missing - Web2APK's default ${f === 'app.json' ? 'settings are' : 'icon is'} used for "${name}"`);
            matrix.push({ name });
          });

          console.log(`Build script source: ${source === '.' ? '"." (this repo)' : '"clone" (official release)'}`);
          console.log(`Will build ${matrix.length} APK(s):`);
          matrix.forEach((m) => console.log(`  - ${dir}/${m.name}/`));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\nsource=${source}\n`);
          NODE

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one failing APK must not stop the others
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout web repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get Web2APK
        env:
          W2A_SOURCE: ${{ needs.plan.outputs.source }}
        run: |
          if [ "$W2A_SOURCE" = "." ]; then
            # run.json source "." -> use this repo's own scripts/build.mjs (no clone)
            if [ ! -f "$GITHUB_WORKSPACE/scripts/build.mjs" ]; then
              echo "::error::run.json source is \".\" but scripts/build.mjs is missing in this repo."
              exit 1
            fi
            echo "Using this repo's build script (source: .)"
            echo "W2A_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          elif [ "${GITHUB_REPOSITORY,,}" = "${WEB2APK_REPO,,}" ]; then
            # running inside the Web2APK repo itself (self-test) - no clone needed
            echo "W2A_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            REPO_URL="https://github.com/$WEB2APK_REPO.git"
            REF="$WEB2APK_REF"
            if [ -z "$REF" ] || [ "$REF" = "latest" ]; then
              # newest release tag of the form vX.Y.Z (no branches, no pre-release tags)
              REF=$(git ls-remote --tags --refs --sort=-v:refname "$REPO_URL" 'v*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
              if [ -z "$REF" ]; then
                echo "::error::No release tag (vX.Y.Z) found in $WEB2APK_REPO. Publish a release, or set WEB2APK_REF to a tag."
                exit 1
              fi
            fi
            echo "Cloning official Web2APK $REF (source: clone)"
            git clone --depth 1 --branch "$REF" "$REPO_URL" "$RUNNER_TEMP/Web2APK"
            echo "W2A_DIR=$RUNNER_TEMP/Web2APK" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          WEB_DIR: ${{ github.workspace }}
          # Only this app's folder (app.json + icon.png) is read; all other folders are ignored.
          CONFIG_DIR: ${{ github.workspace }}/.github/${{ matrix.name }}
          OUT_DIR: ${{ github.workspace }}/output
          # Optional signing key (see example.env). Empty = a temporary key is generated.
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: node "$W2A_DIR/scripts/build.mjs"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.name }}
          path: output/*.apk
          if-no-files-found: error
