<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__NAME__</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:__BG__;color:__FG__;
       font:16px/1.5 system-ui,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
  main{max-width:24rem}
  h1{font-size:1.3rem;margin:0 0 .5rem}
  p{margin:0 0 1.5rem;opacity:.75}
  button{font:inherit;font-weight:600;color:__BG__;background:__FG__;border:0;border-radius:999px;padding:.7em 2em}
  button:active{opacity:.8}
</style>
</head>
<body>
<main>
  <h1>No connection</h1>
  <p>__NAME__ could not load. Check your internet connection and try again.</p>
  <button id="retry" type="button">Try again</button>
</main>
<script>
  var target = __URL__;
  function retry() { window.location.replace(target); }
  document.getElementById('retry').addEventListener('click', retry);
  window.addEventListener('online', retry);
</script>
</body>
</html>
